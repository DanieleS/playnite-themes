Name: Cinema
Author: Davide Specchia
ShortDescription: "Streaming-style home: the selected game's artwork fills the screen, its logo on the left, one row of covers below."
Description: "Cinema turns Playnite's fullscreen mode into a streaming-service home screen. The background art of the selected game fills the TV, the game's logo (via Extra Metadata Loader) or its title sits on the left with release year, genres, developer and time played, and your library is a single row of covers at the bottom. The details view keeps the artwork and adds stat cards for time played, last played, sessions, completion, size and date added."
