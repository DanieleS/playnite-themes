Name: Glass
Author: Davide Specchia
ShortDescription: "Frosted glass panes over the selected game's blurred artwork: a still list on the left, a large preview on the right."
Description: "Glass is inspired by spatial interfaces. The selected game's artwork, heavily blurred, lights the whole room; on top of it float frosted panes: a calm list where only the highlight moves, and a large preview with artwork, logo, chips and numbers. The details view is two glass windows tilted towards you."
