Name: Journal
Author: Davide Specchia
ShortDescription: 'A still grid of covers with your time played, and a bento-style details page.'
Description: "Journal is a dashboard of how you actually play. The library is a still grid of covers with time played on every tile and a bar showing the selected game's hours in large type; nothing moves except the focus. The details view is a bento of tiles: artwork and logo, time played, sessions, last played, completion, size, cover and description."
