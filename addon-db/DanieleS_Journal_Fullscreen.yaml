Name: Journal
Author: Davide Specchia
ShortDescription: 'A still mosaic of big, wide, tall and small tiles with spatial navigation, and a bento-style details page.'
Description: 'Journal lays out your library as a mosaic of big, wide, tall and small tiles that repeats a fixed pattern, so it stays fast with libraries of any size. Navigation is spatial: up, down, left and right go to the tile that is really there. The details view is a bento of tiles: artwork and logo, time played, sessions, last played, completion, size, cover and description.'
