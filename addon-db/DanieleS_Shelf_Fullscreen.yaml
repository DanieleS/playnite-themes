Name: Shelf
Author: Davide Specchia
ShortDescription: 'Your library as a shelf of game boxes on warm paper; the selected game is pulled out, its details are the back of the box.'
Description: "Shelf is a light, collector's-cabinet theme. Every game is a spine made from its own cover art, standing on a wooden plank; the selected game slides out and shows its full box. The details view is the back of the box: big cover, kicker, title, dotted-leader specs and a rubber stamp with your completion status."
