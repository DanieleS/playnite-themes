<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf — box 3D</title>
<style>
  /* Prototype of Shelf's selected box using only affine transforms (skewY + scaleX), which map 1:1 to
     WPF's SkewTransform(AngleY) and ScaleTransform, since WPF has no CSS-like perspective. */
  body { margin:0; background:#ece6da; font-family:Georgia, serif; color:#1d1b17; padding:40px 16px; }
  .wrap { max-width:1200px; margin:0 auto; }
  h1 { font-weight:400; font-size:34px; }
  p { font-family:system-ui; color:#5b554a; max-width:820px; line-height:1.5; }
  .row { display:flex; gap:60px; align-items:flex-end; margin-top:30px; flex-wrap:wrap; }
  .cap { font-family:system-ui; font-size:13px; color:#5b554a; margin-top:30px; text-align:center; }
  .stage { position:relative; height:560px; display:flex; align-items:flex-end; gap:6px; padding:0 10px; }
  .plank { height:18px; background:#2b241b; border-radius:3px; margin-top:-2px; box-shadow:0 10px 20px -6px rgba(0,0,0,.4); }
  .spine { width:62px; height:470px; background-size:auto 100%; background-position:center; position:relative; box-shadow:inset -6px 0 8px rgba(0,0,0,.35); }
  .spine::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.12) 40%, rgba(0,0,0,.5)); }

  /* the box: a spine face + a front face, both from the cover */
  .box { position:relative; width:360px; height:500px; margin:0 26px 0 10px; }
  .box .side, .box .front { position:absolute; bottom:0; background-size:cover; background-position:center; transform-origin:0 100%; }
  .box .side { left:0; width:48px; height:470px; background-position:0 0; filter:brightness(.55) saturate(.9); }
  .box .front { left:48px; width:300px; height:470px; }
  .box .front::after { content:""; position:absolute; inset:0; background:linear-gradient(100deg, rgba(255,255,255,.22), transparent 35%); }
  .box .shadow { position:absolute; left:10px; right:-20px; bottom:-6px; height:30px; background:radial-gradient(ellipse at 50% 50%, rgba(60,40,5,.45), transparent 70%); filter:blur(4px); }

  /* The shared edge (spine/front) is the corner nearest to the viewer: the front recedes to the right,
     the spine recedes to the left. Both skews pivot on that edge; the box is lifted so its lowest corner
     rests on the plank. */
  .box .side  { transform-origin:100% 100%; }
  .box .front { transform-origin:0 100%; }
  .a { transform:translateY(-42px); }
  .a .side  { width:40px; transform: skewY(-24deg); }
  .a .front { left:40px; transform: skewY(8deg); box-shadow:18px 22px 40px -12px rgba(60,40,5,.5); }

  .b { transform:translateY(-27px); }
  .b .side  { width:30px; transform: skewY(-18deg); }
  .b .front { left:30px; transform: skewY(5deg); box-shadow:16px 20px 36px -12px rgba(60,40,5,.5); }

  .c { transform:translateY(-58px); }
  .c .side  { width:52px; transform: skewY(-30deg); }
  .c .front { left:52px; transform: skewY(11deg) scaleX(.96); box-shadow:22px 26px 46px -12px rgba(60,40,5,.55); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shelf — scatola in 3D</h1>
  <p>Tre intensità dello stesso effetto: dorso a sinistra e fronte leggermente ruotato, fatti con le sole trasformazioni disponibili in WPF. A è il compromesso che userei.</p>
  <div class="row" id="rows"></div>
</div>
<script>
const S='https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/';
const cov=id=>`url(${S}${id}/library_600x900.jpg)`;
const spines=[1086940,2379780,504230];
const after=[1145360,1145350,367520];
document.getElementById('rows').innerHTML=['a','b','c'].map(v=>`<div><div class="stage">
  ${spines.map(i=>`<div class="spine" style="background-image:${cov(i)}"></div>`).join('')}
  <div class="box ${v}"><div class="shadow"></div><div class="side" style="background-image:${cov(1245620)}"></div><div class="front" style="background-image:${cov(1245620)}"></div></div>
  ${after.map(i=>`<div class="spine" style="background-image:${cov(i)}"></div>`).join('')}
</div><div class="plank"></div><div class="cap">${v.toUpperCase()}</div></div>`).join('');
</script>
</body>
</html>
